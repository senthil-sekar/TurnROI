name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Report failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object {
              $msg = ($_.Output.ErrorInfo.Message -replace "`r?`n", ' ')
              Write-Output "::error title=$($_.testName)::$msg"
            }
          }
      - name: Smoke test CLI on every source
        shell: bash
        run: |
          set -e
          cli="dotnet run --project src/TurnRoi.Cli -c Release --no-build --"
          for f in tests/TurnRoi.Core.Tests/Fixtures/*.json*  tests/TurnRoi.Core.Tests/Fixtures/*.csv; do
            echo "::group::$f"; $cli analyze "$f" --no-git > /dev/null; echo "::endgroup::"
          done
          $cli profile tests/TurnRoi.Core.Tests/Fixtures/claude-code-basic.jsonl --no-git > /dev/null
          $cli hooks print --agent all > /dev/null
          demo="$RUNNER_TEMP/demo" && mkdir -p "$demo"
          $cli profile tests/TurnRoi.Core.Tests/Fixtures/claude-code-basic.jsonl --apply --agent all --dir "$demo" --yes --no-git > /dev/null
          test -f "$demo/.claude/skills/repo-efficiency/SKILL.md" && test -f "$demo/.cursor/hooks.json" && test -f "$demo/.github/hooks/turnroi.json"
          $cli profile --undo --dir "$demo" > /dev/null
          test ! -e "$demo/.cursor"
      - name: Pack dotnet tool
        run: dotnet pack src/TurnRoi.Cli -c Release --no-build -o nupkg
